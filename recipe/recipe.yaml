context:
  version: "0.2.0"

package:
  name: bttf
  version: ${{ version }}

source:
  url: https://github.com/BurntSushi/bttf/archive/refs/tags/${{ version }}.tar.gz
  sha256: 5399df79e15ba48e94526319ec6baf4e4e9bbe983693adc4ba784294f0875e78

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  # bttf --help returns status code of 1
  - script: bttf
  - package_contents:
      bin:
        - bttf
      strict: true

about:
  homepage: https://github.com/BurntSushi/bttf
  summary: A command line tool for datetime arithmetic, parsing, formatting and more.
  license: MIT OR Unlicense
  license_file:
    - UNLICENSE
    - LICENSE-MIT
    - THIRDPARTY.yml
  repository: https://github.com/BurntSushi/bttf

extra:
  recipe-maintainers:
    - synapticarbors
